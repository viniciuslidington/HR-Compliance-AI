# Blueprint do Render para o hackathon: worker com disco persistente (bucket local + SQLite).
# No painel: New → Blueprint → este repositório. O Render pede FEATHERLESS_API_KEY (segredo) e gera API_TOKEN.
services:
  - type: web
    name: hr-compliance-worker
    runtime: python
    rootDir: worker
    plan: starter # disco persistente exige instância paga
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run uvicorn api:app_do_ambiente --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /saude
    disk:
      name: dados
      mountPath: /var/data # só o que fica aqui sobrevive a deploy e restart
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DADOS_DIR
        value: /var/data
      - key: FEATHERLESS_API_KEY
        sync: false # o valor é colado no painel e não vai para o git
      - key: FEATHERLESS_MODEL
        value: deepseek-ai/DeepSeek-V4.1-Flash-1017
      - key: FEATHERLESS_VISION_MODEL
        value: deepseek-ai/DeepSeek-V4.1-Flash-1017 # lê imagem; o Qwen3-VL-32B do Featherless descartava a imagem
      - key: API_TOKEN
        generateValue: true # exigido em Authorization: Bearer para enviar documento e aprovar
      - key: HOJE
        value: "2026-11-07" # data congelada da demo; remova para usar a data real
      - key: FRONT_URL
        value: https://vinda-web.onrender.com # a raiz do worker redireciona para o front da vinda

  # Front (vinda): painel do RH em /rh e WhatsApp simulado em /whatsapp. O servidor do Next roda o motor
  # da admissão, guarda o estado no disco do worker (/front/kv) e manda as fotos para a IA do worker (/leitura).
  # O token do worker fica só no servidor; o navegador fala apenas com /api/* deste serviço.
  - type: web
    name: vinda-web
    runtime: node
    rootDir: web
    plan: free # dorme após 15 min sem acesso: abra o site 1 minuto antes da demo (ou troque para starter)
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/estado
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TZ
        value: America/Sao_Paulo # o motor calcula prazos no fuso local
      - key: WORKER_URL
        value: https://hr-compliance-worker.onrender.com
      - key: WORKER_TOKEN
        fromService:
          type: web
          name: hr-compliance-worker
          envVarKey: API_TOKEN
