[project]
name = "worker"
version = "0.1.0"
description = "Worker operacional e camada de IA dos agentes de DP"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "openai>=1.40",
    "pydantic>=2.7",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
