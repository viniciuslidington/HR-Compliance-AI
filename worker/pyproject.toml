[project]
name = "worker"
version = "0.1.0"
description = "Worker operacional e camada de IA dos agentes de DP"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
